name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

  # Builds the single-file Windows exe exactly like a release and runs it end to end.
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Smoke test
        run: ./build/smoke-test.ps1 -Exe src/VideoTranscriber/bin/Release/net8.0/win-x64/publish/VideoTranscriber.exe
