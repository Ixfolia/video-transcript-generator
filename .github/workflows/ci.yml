name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

  # Builds the single-file Windows exes exactly like a release and runs them end to end.
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exes
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Smoke test (desktop app)
        run: ./build/smoke-test.ps1 -Mode gui -Exe src/VideoTranscriber.Gui/bin/Release/net8.0/win-x64/publish/VideoTranscriber.exe

      - name: Smoke test (command-line app)
        run: ./build/smoke-test.ps1 -Mode cli -Exe src/VideoTranscriber.Cli/bin/Release/net8.0/win-x64/publish/VideoTranscriber-CLI.exe
